global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'achat-app'
    metrics_path: '/SpringMVC/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8090']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']