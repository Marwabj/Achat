version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-achat
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: achat
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  achat-app:
    build: .
    container_name: achat-app
    ports:
      - "8090:8089"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/achat?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - mysql
    restart: on-failure

volumes:
  mysql-data: